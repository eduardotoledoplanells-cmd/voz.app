name: StackHawk DAST Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  hawkscan:
    name: Run StackHawk Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js App
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Start Next.js Server
        run: npm run start &
        env:
          PORT: 3000

      - name: Wait for Server to be Ready
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run StackHawk HawkScan Action
        uses: stackhawk/hawkscan-action@v2
        with:
          apiKey: ${{ secrets.HAWK_API_KEY || 'hawk.L8iFvSXZ1WwBcq045f4d.q6d3EEKOI7PSp1frjxvR' }}
          configFile: stackhawk.yml
        env:
          HAWK_APP_ID: ${{ secrets.HAWK_APP_ID || '058e0617-b911-4095-a3d0-76e1debadd8d' }}
