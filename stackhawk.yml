# Configuración oficial de StackHawk DAST para LYVO Web & API
app:
  name: LYVO-Web-API
  applicationId: "058e0617-b911-4095-a3d0-76e1debadd8d"
  host: ${HAWK_TARGET_HOST:http://localhost:3000}
  env: Development

hawk:
  failureThreshold: OFF
  
  spider:
    maxDepth: 4
    crawlBudget: 5
  
  excludePaths:
    - /api/voz/stripe/webhook
    - /_next/*
    - /static/*
    - /favicon.ico

tags:
  - nextjs
  - rest-api
  - lyvo
